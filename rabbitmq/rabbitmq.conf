# Configuración común de los dos nodos RabbitMQ de Pedidos360.

# Formación automática del clúster: cada nodo busca a los demás de esta lista al arrancar.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2
cluster_name = pedidos360-cluster

# Interfaz de administración (Management UI y API HTTP)
management.tcp.port = 15672
